[project]
name = "cflow-api"
version = "0.1.0"
description = "cFlow REST API (FastAPI)."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "cflow-core",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "temporalio>=1.7,<2",
    "uvicorn[standard]>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cflow_api"]
