[project]
name = "cflow-core"
version = "0.1.0"
description = "cFlow core library: auth, audit, connections, vault, pipelines, execution engine, ingestion."
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "argon2-cffi>=23.1",
    "openpyxl>=3.1",
    "cryptography>=42.0",
    "duckdb>=1.0",
    "sqlglot>=23.0",
    "python-tds==1.17.1",  # colunar.acelerar_leitura reads internals of this exact version
    "httpx>=0.27",
    "pyjwt>=2.9",
    # Silver as an Iceberg table. `pg8000` (BSD) rather than `psycopg` (LGPL): PyIceberg uses
    # synchronous SQLAlchemy and the platform only has asyncpg; a license check rejects copyleft.
    "pyiceberg>=0.8",
    "pyarrow>=17.0",
    "pg8000>=1.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cflow_core"]
