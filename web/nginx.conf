server {
  listen 80;

  # Cross-origin isolation (SharedArrayBuffer), required by Perspective (WASM/threads).
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cross-Origin-Embedder-Policy require-corp always;

  # API (same origin, so no CORS). The versioned path /api/v1/... is forwarded as is.
  # Resolver + proxy_pass through a variable make nginx RE-RESOLVE the upstream on every DNS window
  # (it does not cache the IP at boot), so restarting the API does not leave the proxy pointing at a
  # stale IP.
  #
  # This file is a TEMPLATE (the nginx image applies envsubst only to the variables DEFINED in the
  # environment, so `$host` and friends pass through untouched). The Dockerfile defaults match
  # docker compose (Docker embedded DNS, service `api`). In Kubernetes set `CFLOW_DNS_RESOLVER` to the
  # cluster DNS service IP and `CFLOW_API_UPSTREAM` to the FULL URL of the API Service
  # (`http://<svc>.<namespace>.svc.cluster.local:8000`): the nginx `resolver` does not use the pod
  # search domains, so a short name does not resolve.
  location /api/ {
    resolver ${CFLOW_DNS_RESOLVER} valid=10s ipv6=off;
    set $api_upstream ${CFLOW_API_UPSTREAM};
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # index.html is NEVER cached: the browser always revalidates the entry point and picks up the new
  # hashed assets (otherwise an old build stays "stuck" in the cache).
  # add_header inside a location replaces the server-level ones, so COOP/COEP are repeated here.
  #
  # The build uses `base: "./"` (the same dist/ can run under any sub-path), so index.html ships
  # `src="./assets/..."`. Relative paths break when a deep route is opened directly (`/execucoes/1`
  # would request `/execucoes/assets/...` and get index.html instead of the JS). Here, at the root,
  # the rewrite returns the absolute path: `="./` becomes `="/`.
  location = /index.html {
    root /usr/share/nginx/html;
    sub_filter '="./' '="/';
    sub_filter_once off;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # SPA (Studio / Model / Portal). Hashed assets (/assets/*) inherit COOP/COEP from the server block
  # and can be cached normally (new hash = new URL).
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
